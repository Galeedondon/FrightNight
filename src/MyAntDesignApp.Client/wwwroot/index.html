  <style>
        .wineglass {
        height: 36px;
        position: relative;
        }
        .wineglass:after {
        content: ''; 
        position: absolute;
        top: 47px;
        left: 5px;
        width: 20px;
        height: 5px;
        background: white;
        box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5);
        }
        .top {
        background: white;
        width: 30px;
        height: 36px;
        border-radius: 0 0 36px 36px;
        box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5);
        }
        .top:before {
        content: ''; 
        position: absolute;
        left: 4px;
        bottom: 4px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: linear-gradient(transparent 50%, #F36E3E 50%);
        }
        .left .top:before {
        animation: rotate2 2s linear infinite;
        }
        .right .top:before {
        animation: rotate1 2s linear infinite;
        }
        .top:after {
        content: ''; 
        position: absolute;
        top: 35px;
        left: 12px;
        width: 6px;
        height: 13px;
        background: white;
        box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5);
        }
        .left {
        display: inline-block;
        margin-right: 10px;
        animation: rotate1 2s cubic-bezier(.39,1.52,.46,.92) infinite;
        }
        .right {
        display: inline-block;
        animation: rotate2 2s cubic-bezier(.39,1.52,.46,.92) infinite;
        }
        @keyframes rotate1{
        0% {transform: rotate(0deg);}
        50% {transform:rotate(22deg);}
        }
        @keyframes rotate2{
        0% {transform:rotate(0deg);}
        50% {transform:rotate(-22deg);}
        }
        ul {
        list-style: none;
        margin: 0;
        padding: 0;
        width: 70px;
        height: 25px;
        position: relative;
        opacity: 0;
        animation: 2s fadeInUp infinite linear 2s;
        }
        li {
        width: 6px;
        height: 15px;
        background: white;
        position: absolute;
        box-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5);
        transform-origin: bottom;
        }
        li:nth-child(1) {
        left: 26px;
        bottom: 5px;
        transform: rotate(-35deg);
        }
        li:nth-child(2) {
        left: 34px;
        bottom: 8px;
        }
        li:nth-child(3) {
        left: 42px;
        bottom: 5px;
        transform: rotate(35deg);
        }
        @keyframes fadeInUp {
        0% {
            opacity: 0;
            transform: scaleY(1);
        }
        
        33% {
            opacity: 1;
            transform: scaleY(1.4);
        }
        64% {
            opacity: .1;
            transform: scaleY(1);
        }
        100% { 
            opacity: 0;
            transform: scaleY(.3);
        }
        }
  </style>
</head>

        <style>
            html,

                height: 100%;

            .page-loading-warp {
                padding: 98px;

            .ant-spin {
                -webkit-box-sizing: border-box;
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                color: rgba(0, 0, 0, 0.65);
                font-size: 14px;
                font-variant: tabular-nums;
                line-height: 1.5;
                list-style: none;
                -webkit-font-feature-settings: 'tnum';
                font-feature-settings: 'tnum';
                position: absolute;
                display: none;
                color: #1890ff;
                text-align: center;
                vertical-align: middle;
                opacity: 0;
                -webkit-transition: -webkit-transform 0.3s cubic-bezier(0.78, 0.14, 0.15, 0.86);
                transition: -webkit-transform 0.3s cubic-bezier(0.78, 0.14, 0.15, 0.86);
                transition: transform 0.3s cubic-bezier(0.78, 0.14, 0.15, 0.86);
                transition: transform 0.3s cubic-bezier(0.78, 0.14, 0.15, 0.86),
                    -webkit-transform 0.3s cubic-bezier(0.78, 0.14, 0.15, 0.86);
            }

            .ant-spin-spinning {
                position: static;
                display: inline-block;
                opacity: 1;
            }

            .ant-spin-dot {
                position: relative;
                display: inline-block;
                font-size: 20px;
                width: 20px;
                height: 20px;
            }

            .ant-spin-dot-item {
                position: absolute;
                display: block;
                width: 9px;
                height: 9px;
                background-color: #1890ff;
                border-radius: 100%;
                -webkit-transform: scale(0.75);
                -ms-transform: scale(0.75);
                transform: scale(0.75);
                -webkit-transform-origin: 50% 50%;
                -ms-transform-origin: 50% 50%;
                transform-origin: 50% 50%;
                opacity: 0.3;
                -webkit-animation: antSpinMove 1s infinite linear alternate;
                animation: antSpinMove 1s infinite linear alternate;
            }

            .ant-spin-dot-item:nth-child(1) {
                top: 0;
                left: 0;
            }

            .ant-spin-dot-item:nth-child(2) {
                top: 0;
                right: 0;
                -webkit-animation-delay: 0.4s;
                animation-delay: 0.4s;
            }

            .ant-spin-dot-item:nth-child(3) {
                right: 0;
                bottom: 0;
                -webkit-animation-delay: 0.8s;
                animation-delay: 0.8s;
            }

            .ant-spin-dot-item:nth-child(4) {
                bottom: 0;
                left: 0;
                -webkit-animation-delay: 1.2s;
                animation-delay: 1.2s;
            }

            .ant-spin-dot-spin {
                -webkit-transform: rotate(45deg);
                -ms-transform: rotate(45deg);
                transform: rotate(45deg);
                -webkit-animation: antRotate 1.2s infinite linear;
                animation: antRotate 1.2s infinite linear;
            }

            .ant-spin-lg .ant-spin-dot {
                font-size: 32px;
                width: 32px;
                height: 32px;
            }

            .ant-spin-lg .ant-spin-dot i {
                width: 14px;
                height: 14px;
            }

            @media all and (-ms-high-contrast: none),
            (-ms-high-contrast: active) {
                .ant-spin-blur {
                    background: #fff;
                    opacity: 0.5;
                }
            }

            @-webkit-keyframes antSpinMove {
                to {
                    opacity: 1;
                }
            }

            @keyframes antSpinMove {
                to {
                    opacity: 1;
                }
            }

            @-webkit-keyframes antRotate {
                to {
                    -webkit-transform: rotate(405deg);
                    transform: rotate(405deg);
                }
            }

            @keyframes antRotate {
                to {
                    -webkit-transform: rotate(405deg);
                    transform: rotate(405deg);
                }
            }
        </style>
